# Runs on every push and pull request. Tests use a synthetic fixture warehouse and block the network,
# so CI never needs AEMO data. It has no NVIDIA_API_KEY and never will: the LLM layer runs offline and
# rebuilds everything from the committed cache in data/llm_cache, failing on a cache miss.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: pip install -r requirements.lock

      - run: python -m pytest
        env:
          NEMSIM_LLM_MODE: offline
